<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ticketverwaltung – FF Ebringen</title>
<link rel="icon" href="logo.png">
<style>
  :root{--red:#b3141b;--bg:#f4f4f5;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--bd:#dcdce0;--warn:#fdecea}
  @media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242427;--tx:#f0f0f2;--mut:#a0a0a8;--bd:#3a3a3f;--warn:#3a1d1d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:linear-gradient(180deg,#c8161e 0%,#9c1017 100%);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  header .wrap{max-width:900px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header .logo{background:#fff;border-radius:10px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  header .logo img{display:block;height:42px;width:auto;max-width:100%}
  header .brand span{font-weight:700;font-size:18px}
  header a,header button{color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.65);border-radius:8px;padding:7px 12px;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
  header a:hover,header button:hover{background:rgba(255,255,255,.28)}
  main{max-width:900px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  .item{border-left:4px solid var(--red)}
  input,select,textarea{width:100%;padding:10px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
  label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
  .btn{padding:11px 16px;border:0;border-radius:8px;background:linear-gradient(180deg,#c8161e,#a0121a);color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
  .btn.sec{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn:disabled{opacity:.6}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .filters label{margin:0 0 3px}
  .cnt{margin:6px 2px 10px;color:var(--mut);font-size:13px}
  .item{cursor:pointer;display:block}
  .item:hover{border-color:var(--red)}
  .item.over{background:var(--warn)}
  .item.closed{opacity:.6}
  .row1{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
  .nr{font-weight:700;color:var(--red);white-space:nowrap}
  .tt{font-weight:600;margin:2px 0}
  .meta{color:var(--mut);font-size:13px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd)}
  .b.p3,.b.pd{background:#b3141b;color:#fff;border-color:#b3141b}
  .b.p2{background:#f59e0b;color:#1d1d1f;border-color:#f59e0b}
  .b.st{background:var(--bg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .kv .k{color:var(--mut);font-size:12px}
  .kv .v{margin-bottom:6px;word-break:break-word}
  .desc{white-space:pre-wrap;word-break:break-word;margin:4px 0 0}
  .edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
  .cm{border-left:3px solid var(--red);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
  .cm .h{font-size:12px;color:var(--mut)}
  .cm .ch{font-style:italic;font-size:13px}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--tx);font-weight:400}
  .chk input{width:auto}
  .err{background:#fdecea;color:#8a1111;border:1px solid #f3b5b0;border-radius:8px;padding:10px 12px;margin-bottom:10px;display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
  .hidden{display:none}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pin{max-width:360px;margin:40px auto}
  a{color:var(--red)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo"><img src="logo.png" alt="Freiwillige Feuerwehr Ebringen"></div><span>Ticketverwaltung</span></div>
  <div>
    <a href="index.html">Meldeformular</a>
    <button id="logout" class="hidden">Abmelden</button>
  </div>
</div></header>
<main>

  <!-- Login -->
  <div id="login" class="card pin">
    <div id="lerr" class="err"></div>
    <label for="pin" style="margin-top:0">Admin-PIN</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    <div class="actions"><button class="btn" id="go" style="width:100%">Anmelden</button></div>
  </div>

  <!-- Liste -->
  <div id="listView" class="hidden">
    <div class="card">
      <div class="filters">
        <div><label>Status</label><select id="fStatus"></select></div>
        <div><label>Kategorie</label><select id="fKat"></select></div>
        <div><label>Priorität</label><select id="fPrio"></select></div>
        <div><label>Suche</label><input type="text" id="fQ" placeholder="Nr, Betreff, Name …"></div>
      </div>
    </div>
    <div class="cnt" id="cnt"></div>
    <div id="items"></div>
  </div>

  <!-- Detail -->
  <div id="detailView" class="hidden">
    <div class="actions" style="margin:0 0 12px">
      <button class="btn sec" id="back">← Zur Liste</button>
      <button class="btn sec" id="pdf">PDF</button>
    </div>
    <div class="card" id="dHead"></div>

    <div class="card">
      <div id="derr" class="err"></div>
      <label style="margin-top:0">Dein Name (für den Verlauf)</label>
      <input type="text" id="autor" maxlength="80" autocomplete="name">
      <div class="edit">
        <div><label>Status</label><select id="eStatus"></select></div>
        <div><label>Priorität</label><select id="ePrio"></select></div>
        <div><label>Zuständig</label><select id="eZust"></select></div>
        <div><label>Fällig am</label><input type="date" id="eFael"></div>
      </div>
      <label>Kommentar</label>
      <textarea id="eKom" maxlength="3000" placeholder="Notiz oder Nachricht …"></textarea>
      <label class="chk" id="chkWrap"><input type="checkbox" id="eAn"> Ersteller per Mail informieren</label>
      <div class="actions"><button class="btn" id="save">Speichern</button></div>
    </div>

    <div class="card"><strong>Verlauf</strong><div id="hist"></div></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  var START_NR = (function () { var n = new URLSearchParams(location.search).get('nr') || ''; return /^[A-Za-z0-9-]{1,30}$/.test(n) ? n : ''; })();
  var $ = function (id) { return document.getElementById(id); };
  var PIN = '', META = null, TICKETS = [], CUR = null;

  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function lstore(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(function () { t.style.display = 'none'; }, 2600); }
  function show(id) { ['login', 'listView', 'detailView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); }); $('logout').classList.toggle('hidden', id === 'login'); window.scrollTo(0, 0); }
  function fillSelect(sel, items, first) {
    sel.innerHTML = '';
    if (first !== undefined) { var o = document.createElement('option'); o.value = ''; o.textContent = first; sel.appendChild(o); }
    items.forEach(function (it) { var o = document.createElement('option'); o.value = o.textContent = it; sel.appendChild(o); });
  }
  function errBox(id, msg) { var e = $(id); e.textContent = msg || ''; e.style.display = msg ? 'block' : 'none'; }

  // ---------- Login ----------
  function login(pin, silent) {
    $('go').disabled = true;
    API.run.withSuccessHandler(function (res) {
      PIN = pin; store('tk_pin', pin);
      META = res.meta; TICKETS = res.tickets;
      setupFilters();
      $('go').disabled = false;
      if (START_NR) { openTicket(START_NR); START_NR = ''; } else { renderList(); show('listView'); }
    }).withFailureHandler(function (e) {
      $('go').disabled = false; store('tk_pin', null);
      if (!silent) errBox('lerr', e && e.message ? e.message : 'Anmeldung fehlgeschlagen.');
    }).adminInit(pin);
  }
  $('go').onclick = function () { errBox('lerr', ''); login($('pin').value.trim(), false); };
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
  $('logout').onclick = function () { PIN = ''; store('tk_pin', null); $('pin').value = ''; show('login'); };
  var saved = store('tk_pin');
  if (saved) login(saved, true);

  // ---------- Liste ----------
  function setupFilters() {
    fillSelect($('fStatus'), META.status.map(function (s) { return s.name; }), 'Alle offenen');
    var all = document.createElement('option'); all.value = '__all'; all.textContent = 'Alle (inkl. geschlossen)'; $('fStatus').insertBefore(all, $('fStatus').children[1]);
    fillSelect($('fKat'), META.kategorien, 'Alle Kategorien');
    fillSelect($('fPrio'), META.prioritaeten, 'Alle Prioritäten');
    fillSelect($('eStatus'), META.status.map(function (s) { return s.name; }));
    fillSelect($('ePrio'), META.prioritaeten);
    fillSelect($('eZust'), META.zustaendige, '– niemand –');
    $('autor').value = lstore('tk_autor') || '';
  }
  ['fStatus', 'fKat', 'fPrio'].forEach(function (id) { $(id).onchange = renderList; });
  $('fQ').oninput = renderList;

  function prioClass(t) { var n = META.prioritaeten.length; return t.prioRank >= n - 1 && n > 2 ? 'pd' : (t.prioRank >= n - 2 && n > 2 ? 'p2' : ''); }

  function renderList() {
    var st = $('fStatus').value, k = $('fKat').value, p = $('fPrio').value, q = $('fQ').value.trim().toLowerCase();
    var list = TICKETS.filter(function (t) {
      if (st === '') { if (t.closed) return false; } else if (st !== '__all' && t.status !== st) return false;
      if (k && t.kategorie !== k) return false;
      if (p && t.prioritaet !== p) return false;
      if (q && (t.nr + ' ' + t.betreff + ' ' + t.ersteller + ' ' + t.objekt + ' ' + t.zustaendig).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      return (a.closed - b.closed) || (b.prioRank - a.prioRank) || (b.erstelltTs - a.erstelltTs);
    });
    $('cnt').textContent = list.length + ' Ticket' + (list.length === 1 ? '' : 's');
    var box = $('items'); box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div class="card meta">Keine Tickets für diesen Filter.</div>'; return; }
    list.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'card item' + (t.overdue ? ' over' : '') + (t.closed ? ' closed' : '');
      d.innerHTML = '<div class="row1"><span class="nr">' + esc(t.nr) + '</span><span class="meta">' + esc(t.erstelltFmt) + '</span></div>' +
        '<div class="tt">' + esc(t.betreff) + '</div>' +
        '<div class="meta">' + esc(t.kategorie) + (t.objekt ? ' · ' + esc(t.objekt) : '') + '</div>' +
        '<div class="meta">von ' + esc(t.ersteller) + (t.zustaendig ? ' · zuständig: ' + esc(t.zustaendig) : '') +
        (t.faelligFmt ? ' · fällig ' + esc(t.faelligFmt) + (t.overdue ? ' ⚠' : '') : '') + '</div>' +
        '<div class="badges"><span class="b ' + prioClass(t) + '">' + esc(t.prioritaet) + '</span><span class="b st">' + esc(t.status) + '</span>' + (t.betroffen ? '<span class="b st">👥 ' + t.betroffen + ' weitere betroffen</span>' : '') + '</div>';
      d.onclick = function () { openTicket(t.nr); };
      box.appendChild(d);
    });
  }

  // ---------- Detail ----------
  function openTicket(nr) {
    API.run.withSuccessHandler(function (res) { CUR = res.ticket; renderDetail(res); show('detailView'); })
      .withFailureHandler(function (e) { toast(e && e.message ? e.message : 'Fehler'); if (!META) return; renderList(); show('listView'); })
      .adminGetTicket(PIN, nr);
  }

  function renderDetail(res) {
    var t = res.ticket;
    var fotos = t.fotos.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener">Foto ' + (i + 1) + '</a>'; }).join(' · ');
    $('dHead').innerHTML =
      '<div class="row1"><span class="nr">' + esc(t.nr) + '</span><span class="meta">' + esc(t.erstelltFmt) + '</span></div>' +
      '<div class="tt" style="font-size:18px">' + esc(t.betreff) + '</div>' +
      '<div class="grid kv" style="margin-top:8px">' +
      kv('Kategorie', t.kategorie) + kv('Objekt', t.objekt || '–') +
      kv('Gemeldet von', t.ersteller + (t.erstellerMail ? ' (' + t.erstellerMail + ')' : '')) +
      kv('Zuletzt geändert', t.geaendertFmt) + '</div>' +
      '<div class="k meta" style="margin-top:6px">Beschreibung</div><div class="desc">' + esc(t.beschreibung) + '</div>' +
      (fotos ? '<div class="k meta" style="margin-top:10px">Fotos</div><div>' + fotos + '</div>' : '');
    $('eStatus').value = t.status;
    $('ePrio').value = t.prioritaet;
    $('eZust').value = t.zustaendig || '';
    if (t.zustaendig && $('eZust').value !== t.zustaendig) {
      var o = document.createElement('option'); o.value = o.textContent = t.zustaendig; $('eZust').appendChild(o); $('eZust').value = t.zustaendig;
    }
    $('eFael').value = t.faellig || '';
    $('eKom').value = '';
    $('eAn').checked = !!t.erstellerMail;
    $('eAn').disabled = !t.erstellerMail;
    $('chkWrap').title = t.erstellerMail ? '' : 'Der Ersteller hat keine E-Mail-Adresse angegeben.';
    errBox('derr', '');
    var h = $('hist'); h.innerHTML = '';
    if (!res.kommentare.length) h.innerHTML = '<div class="meta" style="margin-top:6px">Noch keine Einträge.</div>';
    res.kommentare.slice().reverse().forEach(function (c) {
      var d = document.createElement('div'); d.className = 'cm';
      d.innerHTML = '<div class="h">' + esc(c.zeit) + ' · ' + esc(c.autor) + (c.anErsteller ? ' · an Ersteller' : '') + '</div>' +
        (c.aenderung ? '<div class="ch">' + esc(c.aenderung) + '</div>' : '') +
        (c.text ? '<div class="desc">' + esc(c.text) + '</div>' : '');
      h.appendChild(d);
    });
  }
  function kv(k, v) { return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>'; }

  $('back').onclick = function () { refreshList(); };
  function refreshList() {
    API.run.withSuccessHandler(function (res) { TICKETS = res.tickets; renderList(); show('listView'); })
      .withFailureHandler(function () { renderList(); show('listView'); }).adminInit(PIN);
  }

  $('save').onclick = function () {
    errBox('derr', '');
    var autor = $('autor').value.trim();
    if (autor.length < 2) { errBox('derr', 'Bitte deinen Namen eintragen.'); return; }
    lstore('tk_autor', autor);
    var btn = $('save'); btn.disabled = true; btn.textContent = 'Speichert …';
    API.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = 'Speichern';
      toast(r && r.changed ? 'Gespeichert' : 'Keine Änderung');
      openTicket(CUR.nr);
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Speichern';
      errBox('derr', e && e.message ? e.message : 'Speichern fehlgeschlagen.');
    }).adminUpdate(PIN, CUR.nr, {
      status: $('eStatus').value, prioritaet: $('ePrio').value, zustaendig: $('eZust').value,
      faellig: $('eFael').value, kommentar: $('eKom').value, anErsteller: $('eAn').checked, autor: autor
    });
  };

  $('pdf').onclick = function () {
    var btn = $('pdf'); btn.disabled = true; btn.textContent = 'PDF wird erstellt …';
    API.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = 'PDF';
      var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'PDF';
      toast(e && e.message ? e.message : 'PDF-Fehler');
    }).adminPdf(PIN, CUR.nr);
  };
})();
</script>
</body>
</html>
