<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verwaltung - Feuerwehr Ebringen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; padding: 15px; font-family: sans-serif; }
    .header-bar { background: white; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-left: 6px solid #e30613; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stat-card { background: white; padding: 15px; border-radius: 12px; text-align: center; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .ticket-item { background: white; border-radius: 12px; margin-bottom: 15px; border: none; transition: 0.2s; }
    .note-input { font-size: 0.8rem; border-radius: 6px; border: 1px solid #ddd; margin-top: 5px; width: 100%; }
    .status-select { font-weight: bold; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <div class="header-bar shadow-sm">
      <h4 class="m-0 fw-bold">Verwaltung Feuerwehr Ebringen</h4>
      <button onclick="load()" class="btn btn-sm btn-outline-danger border-0">Aktualisieren 🔄</button>
    </div>

    <!-- Dashboard -->
    <div class="d-flex gap-3 mb-4">
      <div class="stat-card border-bottom border-danger border-4"><small>Offen</small><h3 id="countOffen">0</h3></div>
      <div class="stat-card border-bottom border-warning border-4"><small>In Arbeit/Ersatzteil</small><h3 id="countArbeit">0</h3></div>
      <div class="stat-card border-bottom border-success border-4"><small>Erledigt</small><h3 id="countErledigt">0</h3></div>
    </div>

    <div id="ticketContainer">Lade Daten...</div>
  </div>

  <script>
    // WICHTIG: Ersetze dies durch die exakt selbe URL wie in der index.html
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7L34Zz0yRgxucqtVvRb2MzJQqeThke9zT2BN6Ouy9dtTJupd08HJo8e8pl1PV62sx/exec";

    window.onload = load;
    
    function load() { 
      document.getElementById('ticketContainer').innerHTML = "Lade Tickets...";
      
      fetch(SCRIPT_URL + "?action=getTickets")
        .then(response => response.json())
        .then(data => render(data))
        .catch(err => {
            document.getElementById('ticketContainer').innerHTML = "<div class='alert alert-danger'>Fehler beim Laden der Tickets.</div>";
            alert("Fehler beim Laden: " + err);
        });
    }

    function render(ts) {
      let o = 0, a = 0, e = 0;
      
      if (!ts || ts.length === 0) {
        document.getElementById('ticketContainer').innerHTML = '<div class="alert alert-info text-center">Keine Tickets vorhanden.</div>';
        updateStats(0, 0, 0);
        return;
      }

      const html = ts.map(t => {
        if(t.status === 'Offen') o++;
        else if(t.status === 'Erledigt') e++;
        else a++; // "In Arbeit" und "Warten auf Ersatzteil"
        
        return `
        <div class="card ticket-item shadow-sm p-3">
          <div class="row align-items-center">
            <div class="col-md-7">
              <div class="text-muted small mb-1">${t.zeit} | von <b>${t.name}</b></div>
              <h6 class="fw-bold mb-1">${t.betreff} <small class="text-muted">(${t.id})</small></h6>
              <span class="badge bg-light text-dark border mb-2">${t.bereich}</span>
              <p class="small mb-0 text-secondary">${t.beschreibung}</p>
            </div>
            <div class="col-md-5 mt-2 mt-md-0">
              <textarea id="note_${t.rowId}" class="form-control note-input mb-2" placeholder="Nachricht an Meldenden (optional)..."></textarea>
              <div class="d-flex gap-2">
                <select class="form-select form-select-sm status-select" onchange="upd(${t.rowId}, this.value)">
                  <option value="Offen" ${t.status=='Offen'?'selected':''}>🔴 Offen</option>
                  <option value="In Arbeit" ${t.status=='In Arbeit'?'selected':''}>🟡 In Arbeit</option>
                  <option value="Warten auf Ersatzteil" ${t.status=='Warten auf Ersatzteil'?'selected':''}>📦 Ersatzteil bestellt</option>
                  <option value="Erledigt" ${t.status=='Erledigt'?'selected':''}>🟢 Erledigt</option>
                </select>
                ${t.bild && t.bild !== "Kein Bild vorhanden" ? `<a href="${t.bild}" target="_blank" class="btn btn-sm btn-dark">📸</a>` : ""}
              </div>
            </div>
          </div>
        </div>`;
      }).join('');
      
      document.getElementById('ticketContainer').innerHTML = html;
      updateStats(o, a, e);
    }

    function updateStats(o, a, e) {
      document.getElementById('countOffen').innerText = o;
      document.getElementById('countArbeit').innerText = a;
      document.getElementById('countErledigt').innerText = e;
    }

    function upd(rowId, newStatus) {
      const note = document.getElementById('note_' + rowId).value;
      
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStatus", rowId: rowId, newStatus: newStatus, adminNote: note }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(response => response.json())
      .then(result => {
        alert(result.message);
        load();
      })
      .catch(err => alert("Fehler beim Speichern: " + err));
    }
  </script>
</body>
</html>
